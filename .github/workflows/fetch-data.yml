name: Fetch Latest Lottery Data

on:
  schedule:
    # 每周一、三、六晚上 21:45（北京时间）自动运行抓取
    - cron: '45 13 * * 1,3,6' 
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Data
        run: |
          # 使用 curl 抓取官方或公开的大乐透开奖接口
          curl -s "https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=dlt&issueCount=30" > data.json
          
          # 如果抓取失败，保留旧数据；如果成功，替换旧数据
          if [ -s data.json ]; then
            echo "Data fetched successfully!"
          else
            echo "Fetch failed, keeping old data."
            rm data.json
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto fetch latest lottery data" || exit 0
          git push
