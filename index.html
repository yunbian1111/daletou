<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大乐透智能预测助手(胆拖版)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; color: #333; padding: 20px; max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: #d32f2f; margin-bottom: 5px; }
        .header p { font-size: 14px; color: #666; }
        .card { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; font-size: 16px; color: #1976d2; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .balls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
        .ball { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 14px; }
        .front { background-color: #d32f2f; }
        .back { background-color: #1976d2; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-primary { background-color: #d32f2f; color: #fff; }
        .btn-secondary { background-color: #1976d2; color: #fff; }
        .btn-outline { background-color: #fff; color: #666; border: 1px solid #ccc !important; }
        .btn-active { background-color: #ff9800; color: #fff; border: 1px solid #ff9800 !important; }
        button:hover { opacity: 0.9; }
        .reason-box { background: #f9f9f9; padding: 10px; border-radius: 5px; font-size: 13px; line-height: 1.6; color: #555; margin-top: 10px; white-space: pre-line;}
        .chart-container { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; height: 70px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .bar-wrapper { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .bar { width: 80%; max-width: 12px; border-radius: 2px; transition: height 0.3s; }
        .bar-label { font-size: 9px; color: #666; margin-top: 4px; }
        .hot { background-color: #d32f2f; }
        .warm { background-color: #ff9800; }
        .cold { background-color: #2196f3; }
        .exclude-tag { display: inline-block; background: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin: 2px; }
        .ticket-item { border-bottom: 1px dashed #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .ticket-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .mode-switch { display: flex; gap: 5px; margin-bottom: 15px; }
        .mode-switch button { font-size: 14px; padding: 8px; }
        .info-text { font-size: 12px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="header">
    <h1>大乐透智能预测助手</h1>
    <p id="period-info">正在获取最新期数...</p >
</div>

<div class="card">
    <h3>🎯 智能预测号码</h3>
    
    <!-- 模式切换 -->
    <div class="mode-switch">
        <button class="btn-outline btn-active" onclick="switchMode('normal')" id="btn-normal">普通/套票</button>
        <button class="btn-outline" onclick="switchMode('dantuo')" id="btn-dantuo">胆拖玩法</button>
    </div>

    <!-- 普通模式界面 -->
    <div id="normal-mode">
        <div id="predict-balls"></div>
        <div class="btn-group">
            <button class="btn-primary" onclick="generateSingle()">🔄 单注预测</button>
            <button class="btn-secondary" onclick="generateMulti(5)">🎫 生成5注套票</button>
        </div>
        <div id="predict-reason" class="reason-box">点击按钮生成预测及分析原因...</div>
    </div>

    <!-- 胆拖模式界面 -->
    <div id="dantuo-mode" style="display: none;">
        <p class="info-text">💡 玩法说明：选择1-4个胆码（每注必出），再选择2-10个拖码（与胆码组合），最后选2个后区号码。</p >
        
        <div class="btn-group">
            <button class="btn-primary" onclick="autoSelectDan()">🎲 智能选胆码</button>
            <button class="btn-secondary" onclick="autoSelectTuo()">🎲 智能选拖码</button>
        </div>
        
        <div style="margin: 10px 0;">
            <strong>我的胆码 (1-4个):</strong>
            <div id="my-dan" class="balls"></div>
        </div>
        <div style="margin: 10px 0;">
            <strong>我的拖码 (2-10个):</strong>
            <div id="my-tuo" class="balls"></div>
        </div>
        <div style="margin: 10px 0;">
            <strong>后区号码 (2个):</strong>
            <div id="my-back" class="balls"></div>
        </div>

        <button class="btn-primary" onclick="generateDantuo()" style="margin-top:10px;">🎫 一键生成胆拖组合</button>
        <div id="dantuo-result" class="reason-box"></div>
        <div id="dantuo-tickets" style="margin-top:15px;"></div>
    </div>
</div>

<div class="card">
    <h3>📈 号码趋势分析 (近30期)</h3>
    <div id="trend-chart" class="chart-container"></div>
    <div id="trend-reason" class="reason-box" style="margin-top:10px;">加载中...</div>
</div>

<div class="card">
    <h3>🚫 号码排除分析</h3>
    <div id="exclude-list"></div>
    <div id="exclude-reason" class="reason-box">加载中...</div>
</div>

<script>
    let historyData = [];
    let currentMode = 'normal';
    let selectedDan = [];
    let selectedTuo = [];
    let selectedBack = [];

    async function fetchRealData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Network response was not ok');
            const jsonData = await response.json();
            if (jsonData && jsonData.result) {
                historyData = jsonData.result.map(item => ({
                    code: item.red.split(',').concat(item.blue.split(',')),
                    date: item.date,
                    issue: item.code
                }));
            } else { throw new Error("数据格式异常"); }
        } catch (e) {
            console.warn("真实数据加载失败，已切换至内置模拟数据", e);
            loadFallbackData();
        }
        updateUI();
    }

    function loadFallbackData() {
        historyData = [
            {code:['09','11','18','26','33','09','11'], date:'2026-09-06', issue:'26102'},
            {code:['02','06','11','15','31','07','08'], date:'2026-09-03', issue:'26101'}
        ];
    }

    function updateUI() {
        const latest = historyData[0];
        document.getElementById('period-info').innerText = `最新开奖：第${latest.issue}期 (${latest.date}) | 数据已自动更新`;
        renderTrendChart(); 
        renderExcludes(); 
        if(currentMode === 'normal') generateSingle();
    }

    // 切换模式
    function switchMode(mode) {
        currentMode = mode;
        document.getElementById('normal-mode').style.display = mode === 'normal' ? 'block' : 'none';
        document.getElementById('dantuo-mode').style.display = mode === 'dantuo' ? 'block' : 'none';
        
        document.getElementById('btn-normal').className = mode === 'normal' ? 'btn-outline btn-active' : 'btn-outline';
        document.getElementById('btn-dantuo').className = mode === 'dantuo' ? 'btn-outline btn-active' : 'btn-outline';
    }

    // 获取排除号码
    function getExcludedNumbers() {
        const excludes = [];
        if(historyData[0]) excludes.push(historyData[0].code[0], historyData[0].code[4]);
        excludes.push('04', '34'); 
        return [...new Set(excludes)];
    }

    // 获取热号
    function getHotNumbers() {
        const freq = {};
        historyData.slice(0,10).forEach(d => d.code.slice(0,5).forEach(n => freq[n] = (freq[n]||0)+1));
        return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(e=>e[0]);
    }

    // 普通模式：生成一组号码
    function getOneTicket() {
        const excludes = getExcludedNumbers();
        let frontPool = [];
        for(let i=1; i<=35; i++){
            let num = String(i).padStart(2,'0');
            if(!excludes.includes(num)) frontPool.push(num);
        }
        while(frontPool.length < 10) frontPool.push(String(Math.floor(Math.random()*35)+1).padStart(2,'0'));

        let front = [], back = [];
        while(front.length < 5) {
            const idx = Math.floor(Math.random() * frontPool.length);
            const num = frontPool.splice(idx, 1)[0];
            if(!front.includes(num)) front.push(num);
        }
        while(back.length < 2) {
            const num = String(Math.floor(Math.random()*12)+1).padStart(2,'0');
            if(!back.includes(num)) back.push(num);
        }
        front.sort((a,b)=>a-b); back.sort((a,b)=>a-b);
        return { front, back };
    }

    // 普通模式：生成单注
    function generateSingle() {
        const ticket = getOneTicket();
        const ballsHtml = ticket.front.map(n=>`<div class="ball front">${n}</div>`).join('') + ticket.back.map(n=>`<div class="ball back">${n}</div>`).join('');
        document.getElementById('predict-balls').innerHTML = `<div class="ticket-item">${ballsHtml}</div>`;
        
        const reason = `【选号逻辑】\n1. 区间分布：前区号码覆盖了小、中、大三个区间。\n2. 冷热搭配：选取了近期热号 ${ticket.front[0]} 与温号 ${ticket.front[2]} 组合。\n3. 奇偶比例：本组奇偶比为 ${ticket.front.filter(n=>n%2!==0).length}:${ticket.front.filter(n=>n%2===0).length}。\n4. 排除策略：已成功过滤掉极冷号及上期重号。`;
        document.getElementById('predict-reason').innerText = reason;
    }

    // 普通模式：生成多注套票
    function generateMulti(count) {
        let allHtml = '';
        let reasons = [];
        for(let i=0; i<count; i++) {
            const ticket = getOneTicket();
            const ballsHtml = ticket.front.map(n=>`<div class="ball front">${n}</div>`).join('') + ticket.back.map(n=>`<div class="ball back">${n}</div>`).join('');
            allHtml += `<div class="ticket-item">${ballsHtml}</div>`;
            reasons.push(`第${i+1}注：奇偶比 ${ticket.front.filter(n=>n%2!==0).length}:${ticket.front.filter(n=>n%2===0).length}，核心热号 ${ticket.front[0]}`);
        }
        document.getElementById('predict-balls').innerHTML = allHtml;
        document.getElementById('predict-reason').innerText = `【${count}注套票分析】\n` + reasons.join('\n');
    }

    // 胆拖模式：智能选胆码 (1-4个)
    function autoSelectDan() {
        selectedDan = [];
        const hotNums = getHotNumbers();
        // 从热号中随机选1-4个作为胆码
        const danCount = Math.floor(Math.random() * 4) + 1;
        while(selectedDan.length < danCount) {
            const num = hotNums[Math.floor(Math.random() * hotNums.length)];
            if(!selectedDan.includes(num)) selectedDan.push(num);
        }
        selectedDan.sort((a,b)=>a-b);
        renderDanTuoUI();
    }

    // 胆拖模式：智能选拖码 (2-10个)
    function autoSelectTuo() {
        selectedTuo = [];
        const excludes = getExcludedNumbers();
        let pool = [];
        for(let i=1; i<=35; i++){
            let num = String(i).padStart(2,'0');
            if(!excludes.includes(num) && !selectedDan.includes(num)) pool.push(num);
        }
        // 随机选2-10个作为拖码
        const tuoCount = Math.floor(Math.random() * 9) + 2;
        while(selectedTuo.length < tuoCount && pool.length > 0) {
            const idx = Math.floor(Math.random() * pool.length);
            selectedTuo.push(pool.splice(idx, 1)[0]);
        }
        selectedTuo.sort((a,b)=>a-b);
        renderDanTuoUI();
    }

    // 胆拖模式：选后区
    function autoSelectBack() {
        selectedBack = [];
        while(selectedBack.length < 2) {
            const num = String(Math.floor(Math.random()*12)+1).padStart(2,'0');
            if(!selectedBack.includes(num)) selectedBack.push(num);
        }
        selectedBack.sort((a,b)=>a-b);
        renderDanTuoUI();
    }

    // 渲染胆拖UI
    function renderDanTuoUI() {
        document.getElementById('my-dan').innerHTML = selectedDan.length > 0 ? selectedDan.map(n=>`<div class="ball front">${n}</div>`).join('') : '<span class="info-text">点击"智能选胆码"</span>';
        document.getElementById('my-tuo').innerHTML = selectedTuo.length > 0 ? selectedTuo.map(n=>`<div class="ball front" style="background:#ff9800">${n}</div>`).join('') : '<span class="info-text">点击"智能选拖码"</span>';
        
        if(selectedBack.length === 0) autoSelectBack();
        document.getElementById('my-back').innerHTML = selectedBack.map(n=>`<div class="ball back">${n}</div>`).join('');
    }

    // 胆拖模式：生成组合
    function generateDantuo() {
        if(selectedDan.length === 0 || selectedTuo.length === 0 || selectedBack.length !== 2) {
            alert('请先选择胆码、拖码和后区号码！');
            return;
        }

        // 计算组合数：从拖码中选 (5 - 胆码数量) 个
        const needFromTuo = 5 - selectedDan.length;
        if(needFromTuo <= 0 || selectedTuo.length < needFromTuo) {
            alert('拖码数量不足，请增加拖码！');
            return;
        }

        // 计算组合数 C(n, k)
        function combination(n, k) {
            if (k > n || k < 0) return 0;
            if (k === 0 || k === n) return 1;
            let result = 1;
            for (let i = 0; i < k; i++) {
                result = result * (n - i) / (i + 1);
            }
            return Math.round(result);
        }

        const totalTickets = combination(selectedTuo.length, needFromTuo);
        const totalPrice = totalTickets * 2;

        let resultText = `【胆拖组合分析】\n`;
        resultText += `胆码 (${selectedDan.length}个): ${selectedDan.join(', ')}\n`;
        resultText += `拖码 (${selectedTuo.length}个): ${selectedTuo.join(', ')}\n`;
        resultText += `后区 (2个): ${selectedBack.join(', ')}\n\n`;
        resultText += `🎯 共生成 ${totalTickets} 注，预计花费 ${totalPrice} 元`;
        
        document.getElementById('dantuo-result').innerText = resultText;

        // 生成所有组合
        function getCombinations(arr, k) {
            let result = [];
            function combine(start, combo) {
                if (combo.length === k) {
                    result.push([...combo]);
                    return;
                }
                for (let i = start; i < arr.length; i++) {
                    combo.push(arr[i]);
                    combine(i + 1, combo);
                    combo.pop();
                }
            }
            combine(0, []);
            return result;
        }

        const tuoCombinations = getCombinations(selectedTuo, needFromTuo);
        let ticketsHtml = '';
        
        tuoCombinations.forEach((tuoCombo, index) => {
            let frontNums = [...selectedDan, ...tuoCombo];
            frontNums.sort((a,b)=>a-b);
            const ballsHtml = frontNums.map(n=>`<div class="ball front">${n}</div>`).join('') + selectedBack.map(n=>`<div class="ball back">${n}</div>`).join('');
            ticketsHtml += `<div class="ticket-item"><span style="font-size:12px;color:#888">第${index+1}注</span><br>${ballsHtml}</div>`;
        });

        document.getElementById('dantuo-tickets').innerHTML = ticketsHtml;
    }

    function renderExcludes() {
        const excludes = getExcludedNumbers();
        const html
