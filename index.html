<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能大乐透数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: #d9534f; margin-bottom: 30px; }
        .header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .latest-period { font-size: 1.1em; font-weight: bold; color: #333; }
        .controls { display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95em; color: #fff; transition: all 0.2s; }
        .btn-mode { background-color: #337ab7; }
        .btn-gen { background-color: #5cb85c; }
        .btn:hover { opacity: 0.8; }
        .chart-container { position: relative; height: 400px; width: 100%; margin-top: 20px; }
        .analysis-box { padding: 15px; background: #f9f9f9; border-radius: 8px; border-left: 5px solid #5cb85c; margin-top: 20px; }
        .ball-container { display: flex; gap: 5px; margin-top: 10px; }
        .ball { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 0.9em; }
        .red { background-color: #d9534f; }
        .blue { background-color: #337ab7; }
        .loading { text-align: center; padding: 40px; color: #999; font-size: 1.2em; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>智能大乐透数据分析</h1>
        
        <div class="card">
            <div class="header-info">
                <div class="latest-period" id="period-display">正在获取最新期数...</div>
                <div class="controls">
                    <button class="btn btn-mode" id="mode-btn" onclick="switchMode()">切换到：排除模式</button>
                </div>
            </div>
            
            <div class="controls" style="justify-content: flex-end; margin-bottom: 10px;">
                <button class="btn btn-gen" onclick="generateSingle()">生成单注</button>
                <button class="btn btn-gen" onclick="generateMulti()">生成5注</button>
            </div>
            <div id="result-area" class="hidden"></div>

            <div id="loading-spinner" class="loading">⏳ 数据加载中，请稍候...</div>
            
            <div class="chart-container hidden" id="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
            
            <div id="analysis-text" class="analysis-box hidden"></div>
        </div>
    </div>

<script>
    let currentMode = 'trend'; // 当前模式：trend(趋势) 或 exclude(排除)
    let chart = null;

    // 网页加载完成后立即获取真实数据
    window.addEventListener('load', () => {
        fetchRealData();
    });

    // 核心：读取GitHub仓库中的真实data.json
    async function fetchRealData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            
            document.getElementById('period-display').innerText = `最新期数：${data.period}`;
            document.getElementById('loading-spinner').classList.add('hidden');
            document.getElementById('chart-wrapper').classList.remove('hidden');
            document.getElementById('analysis-text').classList.remove('hidden');
            
            renderChartAndAnalysis(data);
        } catch (error) {
            document.getElementById('loading-spinner').innerText = `❌ 数据加载失败：${error.message}`;
        }
    }

    // 渲染图表和分析文字
    function renderChartAndAnalysis(data) {
        const ctx = document.getElementById('myChart').getContext('2d');
        
        // 销毁旧图表，防止重影
        if (chart) chart.destroy();

        if (currentMode === 'trend') {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.chartLabels,
                    datasets: [{
                        label: '近30期号码趋势',
                        data: data.chartData,
                        borderColor: '#d9534f',
                        backgroundColor: 'rgba(217, 83, 79, 0.2)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
            document.getElementById('analysis-text').innerHTML = `
                <strong>📊 号码趋势分析</strong><br>
                根据最近30期开奖数据，前区号码呈现较为明显的波动走势。近期热码集中在 ${data.hotNumbers.join(', ')}，冷码为 ${data.coldNumbers.join(', ')}。
            `;
        } else {
            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.excludeLabels,
                    datasets: [{
                        label: '号码历史频次',
                        data: data.excludeData,
                        backgroundColor: '#5cb85c'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
            document.getElementById('analysis-text').innerHTML = `
                <strong>🚫 号码排除分析</strong><br>
                结合历史频次与近期形态，建议本期排除出现频次极高的号码：${data.excludeNumbers.join(', ')}，以及长期未出的极冷码：${data.deadNumbers.join(', ')}。
            `;
        }
    }

    // 切换趋势/排除模式
    window.switchMode = function() {
        currentMode = currentMode === 'trend' ? 'exclude' : 'trend';
        document.getElementById('mode-btn').innerText = 
            currentMode === 'trend' ? '切换到：排除模式' : '切换到：趋势模式';
        fetchRealData(); // 重新获取数据并渲染
    };

    // 大乐透随机生成辅助函数
    function generateLottoNumbers() {
        const redBalls = Array.from({length: 35}, (_, i) => i + 1);
        const blueBalls = Array.from({length: 12}, (_, i) => i + 1);
        
        const pickRed = [];
        for(let i=0; i<5; i++) {
            const index = Math.floor(Math.random() * redBalls.length);
            pickRed.push(redBalls.splice(index, 1)[0]);
        }
        const pickBlue = [];
        for(let i=0; i<2; i++) {
            const index = Math.floor(Math.random() * blueBalls.length);
            pickBlue.push(blueBalls.splice(index, 1)[0]);
        }
        return { red: pickRed.sort((a,b)=>a-b), blue: pickBlue.sort((a,b)=>a-b) };
    }

    // 生成单注
    window.generateSingle = function() {
        const resultArea = document.getElementById('result-area');
        const nums = generateLottoNumbers();
        
        let html = '<div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px dashed #eee;">';
        nums.red.forEach(n => html += `<span class="ball red">${n}</span>`);
        nums.blue.forEach(n => html += `<span class="ball blue">${n}</span>`);
        html += '</div>';
        
        resultArea.innerHTML += html;
        resultArea.classList.remove('hidden');
    };

    // 生成多注（5注）
    window.generateMulti = function() {
        for(let i=0; i<5; i++) {
            generateSingle();
        }
    };
</script>
</body>
</html>
